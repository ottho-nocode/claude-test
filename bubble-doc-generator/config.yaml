# Configuration du Bubble Doc Generator

# Modèle d'embeddings pour le RAG (local, gratuit)
embeddings:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu"  # Ou "cuda" si GPU disponible

# Configuration Claude
claude:
  model: "claude-sonnet-4-20250514"
  max_tokens_stories: 4096
  max_tokens_flows: 4096
  max_tokens_cdc: 8192
  max_tokens_screens: 8192

# Configuration RAG
rag:
  chunk_size: 1000
  chunk_overlap: 200
  max_chunks_per_query: 10

# Configuration scraping
scraper:
  delay_between_requests: 1  # secondes
  timeout: 30  # secondes
  user_agent: "Mozilla/5.0 (compatible; BubbleDocGenerator/0.1.0)"

# Chemins
paths:
  data_dir: "data"
  transcriptions_dir: "data/transcriptions"
  knowledge_base_dir: "data/knowledge-base"
  templates_dir: "data/templates"
  output_dir: "data/output"
